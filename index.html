<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Parrot 德文聽寫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --desk:#EDF0F4; --paper:#FFFFFF; --side:#F6F7F9;
    --text:#1D232B; --muted:#67717D; --line:#DCE1E8; --hover:#EBEFF4;
    --ink:#1F3C88; --ink-soft:#E6ECF8; --on-ink:#FFFFFF;
    --rule:#D3DEED; --margin:#E2625A;
    --ok:#2C7A4B; --bad:#C8302B; --bad-bg:#FBEAE9; --case:#7A4FC4; --case-bg:#F1EBFA; --typing:#9A6A12;
    --field:#FFFFFF; --placeholder:#9AA3AE; --track:#DFE5EC;
    --notice-bg:#FFF6E0; --notice-line:#EBD49B; --notice-ink:#6E5310;
    --overlay:rgba(18,24,38,.45);
    --sans:"Source Sans 3","Noto Sans TC",system-ui,sans-serif;
    --serif:"Literata","Noto Serif TC",Georgia,serif;
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --desk:#121822; --paper:#1A2130; --side:#161C27;
    --text:#E4E8EF; --muted:#97A1AF; --line:#2B3444; --hover:#222B3A;
    --ink:#8FAEF2; --ink-soft:#22304D; --on-ink:#0E1420;
    --rule:#283247; --margin:#B5524C;
    --ok:#5CC48A; --bad:#FF7469; --bad-bg:#3A1F22; --case:#B996FF; --case-bg:#2C2342; --typing:#E2B24F;
    --field:#141A26; --placeholder:#6C7686; --track:#2A3343;
    --notice-bg:#2D2716; --notice-line:#5B4B22; --notice-ink:#EED696;
    --overlay:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:var(--paper);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
  .brand .mark{width:30px;height:30px;color:var(--ink)}
  .brand .name{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em}
  .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:-2px}
  .head-right{display:flex;align-items:center;gap:8px}
  .voice-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);max-width:200px;font-size:13px}
  .icon-btn,.theme-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer;font-size:14px;white-space:nowrap}
  .icon-btn:hover,.theme-btn:hover{background:var(--hover)}
  #themeBtn{width:34px;justify-content:center;padding:0}
  .sync{font-size:12px;color:var(--muted)}
  @media (max-width:820px){ .voice-wrap span, .brand small{display:none} header{padding:10px 14px} }

  /* layout */
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 57px)}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px}
  @media (max-width:860px){aside{border-right:none;border-bottom:1px solid var(--line);max-height:46vh;overflow:auto}}
  aside .card{background:none;border:none;padding:0}
  .side-title{display:none}
  main{padding:28px 40px 48px}
  main > *{max-width:920px}
  @media (max-width:860px){main{padding:20px 16px 40px}
    .words{--lh:40px;font-size:19px;padding-left:38px}
    .words::before{left:24px}
    .stats{margin-left:0}}

  /* sidebar list */
  .review-box{padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .lesson{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px 8px 12px;border-radius:6px;cursor:pointer;margin-bottom:1px;position:relative}
  .lesson:hover{background:var(--hover)}
  .lesson.active{background:var(--paper);box-shadow:inset 3px 0 0 var(--ink)}
  .lesson .name{font-weight:600;font-size:14px;line-height:1.3}
  .lesson .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:1px}
  .lesson .name .ic{width:16px;height:16px;margin-right:6px;color:var(--ink)}
  .review-box .lesson[data-empty] .meta span:first-child{color:var(--muted)}
  .count-badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:700;text-align:center}
  .mini-bar{height:3px;background:var(--track);border-radius:2px;margin-top:6px;overflow:hidden}
  .mini-bar i{display:block;height:100%;background:var(--ink);width:0}
  .group{margin-top:6px}
  .group-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:8px 10px;cursor:pointer;border-radius:6px;text-align:left}
  .group-h:hover{background:var(--hover)}
  .chev{display:inline-flex;color:var(--muted);transition:transform .15s}
  .chev .ic{width:14px;height:14px}
  .group-h[data-open="0"] .chev{transform:rotate(-90deg)}
  .g-name{flex:1;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .g-name .ic{width:16px;height:16px;color:var(--muted)}
  .g-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .group-b{padding:2px 0 6px 10px}
  .add-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;background:none;cursor:pointer;font-size:13px;color:var(--text);text-align:left}
  .add-btn:hover{border-color:var(--ink);color:var(--ink)}
  .add-btn .ic{width:16px;height:16px}
  .add-btn .lock{margin-left:auto;color:var(--muted)}
  .empty-note{font-size:12px;color:var(--muted);padding:4px 10px 2px;line-height:1.45}
  .del{font-size:12px;color:var(--bad);cursor:pointer;margin-left:6px}

  /* lesson head */
  .card{background:none;border:none}
  .top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .lesson-title{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.015em;margin:0}
  .lesson-sub{color:var(--muted);font-size:15px;margin-top:4px}
  .head-meta{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .level-tag{border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--text);background:var(--paper)}
  .progress{height:2px;background:var(--track);margin:18px 0 22px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--ink);transition:width .3s}

  /* video */
  .video-wrap{position:relative;aspect-ratio:16/9;width:100%;border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px}
  .video-wrap iframe,.video-wrap #ytPlayer{position:absolute;inset:0;width:100%;height:100%;border:0}
  .cc-cover{position:absolute;left:0;right:0;bottom:11%;height:19%;background:rgba(0,0,0,.92);pointer-events:none;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
  .video-err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(0,0,0,.85);color:#fff;font-size:14px}
  .video-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:var(--muted)}

  /* player row */
  .player{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .play{width:56px;height:56px;border-radius:50%;border:none;background:var(--ink);color:var(--on-ink);cursor:pointer;display:grid;place-items:center}
  .play .ic{width:22px;height:22px;fill:currentColor;margin-left:3px}
  .play:hover{filter:brightness(1.12)}
  .play:active{transform:scale(.96)}
  .speeds{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
  .chip{border:none;background:none;padding:6px 12px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
  .speeds .chip + .chip{border-left:1px solid var(--line)}
  .chip.on{background:var(--ink-soft);color:var(--ink);font-weight:700}
  #ccBtn{border:1px solid var(--line);border-radius:6px;background:var(--paper)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--c)}
  .stats{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:16px;font-variant-numeric:tabular-nums}
  .stats b{color:var(--text)}

  /* the dictation sheet */
  .words{--lh:46px;position:relative;margin:22px 0 10px;padding:9px 20px 9px 64px;min-height:calc(var(--lh) * 2 + 18px);
    background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px), var(--rule) var(--lh));
    background-position:0 -4px;border:1px solid var(--line);border-radius:4px;
    font-family:var(--serif);font-size:22px;line-height:var(--lh);color:var(--ink)}
  .words::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--margin);opacity:.75}
  .w{display:inline-block;margin:0 9px 0 0;padding:0 2px;white-space:pre;vertical-align:baseline}
  .w.ok{color:var(--ink)}
  .w.empty{display:inline-flex;gap:3px;align-items:flex-end;height:1em;vertical-align:-2px}
  .w.empty i{display:inline-block;width:.5em;height:0;border-bottom:2px solid var(--muted);opacity:.55}
  .w.empty b{font-weight:400;color:var(--muted);line-height:0;padding-bottom:.1em}
  .w.case{color:var(--case);background:var(--case-bg);border-radius:3px}
  .w.bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
  .misses{margin:0 0 10px;font-size:13px;color:var(--muted)}
  .misses:empty{margin:0}
  .misses .w{font-family:var(--serif);font-size:15px;margin-left:6px}

  /* answer line */
  .input-row{position:relative}
  input.answer{width:100%;font-family:var(--serif);font-size:20px;padding:12px 14px;border:1px solid var(--line);border-bottom:2px solid var(--ink);border-radius:4px 4px 0 0;outline:none;background:var(--field);color:var(--text);caret-color:var(--ink)}
  input.answer::placeholder{color:var(--placeholder);font-family:var(--sans);font-size:15px}
  input.answer:focus{border-color:var(--ink)}
  input.answer.done{border-bottom-color:var(--ok)}
  .umlauts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .umlauts button{font-family:var(--serif);font-size:16px;width:36px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:4px;cursor:pointer}
  .umlauts button:hover{border-color:var(--ink);color:var(--ink)}

  /* actions */
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}
  .actions .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
  .btn:hover{background:var(--hover)}
  .btn .ic{width:16px;height:16px}
  .btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .btn.primary:hover{filter:brightness(1.12);background:var(--ink)}
  .btn.quiet{border-color:transparent;background:none;color:var(--muted)}
  .btn.quiet:hover{color:var(--text);background:var(--hover)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* feedback: a teacher's note in the margin */
  .feedback{margin-top:18px;padding:12px 16px 12px 14px;border-left:3px solid var(--ok);background:var(--paper);display:none}
  .feedback.show{display:block}
  .feedback .de{font-family:var(--serif);font-size:17px}
  .feedback .zh{color:var(--muted);margin-top:2px}
  .feedback .badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ok);margin-bottom:4px}
  .feedback .badge .ic{width:16px;height:16px}
  .feedback .badge.meh{color:var(--typing)}
  .feedback:has(.badge.meh){border-left-color:var(--typing)}

  .keys{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  kbd{font-family:var(--sans);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--paper);color:var(--text)}
  .notice{background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-ink);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .notice.show{display:block}

  /* summary */
  .summary{text-align:left;padding:8px 0}
  .summary h2{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 6px}
  .summary .nums{display:flex;gap:40px;margin:22px 0}
  .summary .nums b{display:block;font-family:var(--serif);font-size:34px;font-weight:600;color:var(--ink)}
  .summary .nums span{font-size:13px;color:var(--muted)}
  .summary .actions{justify-content:flex-start !important}
  .counter{font-size:14px;color:var(--muted)}

  /* modals */
  .modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal-bg.show{display:flex}
  .modal{background:var(--paper);color:var(--text);border-radius:10px;padding:24px;width:min(540px,100%);box-shadow:0 20px 60px rgba(10,20,40,.25)}
  .modal h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 6px}
  .modal h4{margin:16px 0 6px;font-size:13px}
  .modal p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .modal label{display:block;font-size:13px;font-weight:600;margin:4px 0 6px}
  .modal .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .modal input,.modal textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:var(--field)}
  .modal input::placeholder,.modal textarea::placeholder{color:var(--placeholder)}
  .modal input[type=checkbox]{width:auto;margin:0}
  .modal input[type=file]{padding:7px}
  .modal textarea{min-height:150px;resize:vertical}
  .modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
  .check{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
  .ok-msg{color:var(--ok)}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:12px}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:4px 0 12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .link{background:none;border:none;padding:0;font-size:13px;color:var(--ink);cursor:pointer}
  .link:hover{text-decoration:underline}
  .auth-links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .st-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
  .st-nums b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink)}
  .st-nums span{font-size:12px;color:var(--muted)}
  .st-row{display:grid;grid-template-columns:32px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin-bottom:4px}
  .st-row .mini-bar{margin:0}
  .st-row span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .st-words{display:flex;flex-wrap:wrap;gap:6px}
  .st-words span{font-family:var(--serif);font-size:14px;padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
  .st-words b{color:var(--bad);font-family:var(--sans);font-size:12px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-6 5v-5H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12.5" cy="11" r="1.7" fill="currentColor"/><circle cx="19.5" cy="11" r="1.7" fill="currentColor"/><path d="M10 17h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div><div class="name">German Parrot</div><small data-i18n="tagline">德文逐句聽寫</small></div>
  </div>
  <div class="head-right"><div class="voice-wrap"><span data-i18n="voice">語音</span> <select id="voiceSel"></select></div><select id="langSel" class="lang-sel" aria-label="Language"></select><button class="theme-btn" id="themeBtn"></button><span class="sync" id="syncState"></span><button class="theme-btn" id="authBtn"></button></div>
</header>

<div class="layout">
  <aside>
    <div class="card">
      <div class="side-title" data-i18n="lessons">課程</div>
      <div id="lessonList"></div>
    </div>
  </aside>

  <main>
    <div class="notice" id="voiceNotice" data-i18n="voiceNotice">這個瀏覽器找不到德文語音。建議用 Chrome 或 Edge 開啟；macOS 可到「系統設定 → 輔助使用 → 朗讀內容」下載德文語音（例如 Anna）。</div>
    <div class="card" id="practice">
      <div class="top-row">
        <div>
          <h1 class="lesson-title" id="lessonTitle"></h1>
          <div class="lesson-sub" id="lessonSub"></div>
        </div>
        <div class="head-meta"><span class="level-tag" id="levelTag"></span><span id="counter"></span></div>
      </div>
      <div class="progress"><i id="progBar"></i></div>
      <div id="videoArea" style="display:none">
        <div class="video-wrap"><div id="ytPlayer"></div><div class="cc-cover" id="ccCover" data-i18n="ccCover">字幕遮罩</div><div class="video-err" id="videoErr" data-i18n="videoGone"></div></div>
        <div class="video-tools"><button class="chip on" id="ccBtn" data-i18n="ccBtn">遮住字幕</button><span data-i18n="videoTip"></span></div>
      </div>

      <div class="player">
        <button class="play" id="playBtn" data-i18n-title="playTitle" title="播放 (Enter)"><span data-icon="play"></span></button>
        <div>
          <div class="speeds" id="speeds">
            <button class="chip" data-rate="0.6">0.6×</button>
            <button class="chip" data-rate="0.8">0.8×</button>
            <button class="chip on" data-rate="1">1.0×</button>
          </div>
          <div class="legend">
            <span style="--c:var(--ok)" data-i18n="lgOk">正確</span>
            <span style="--c:var(--case)" data-i18n="lgCase">大小寫錯</span>
            <span style="--c:var(--bad)" data-i18n="lgBad">拼錯</span>
            <span style="--c:var(--typing)" data-i18n="lgTyping">輸入中</span>
          </div>
        </div>
        <div class="stats"><span><span data-i18n="stReplay">重播</span> <b id="sReplay">0</b></span><span><span data-i18n="stHint">提示</span> <b id="sHint">0</b></span><span><span data-i18n="stErr">錯字</span> <b id="sErr">0</b></span></div>
      </div>

      <div class="words" id="words"></div>
      <div class="misses" id="misses"></div>

      <div class="input-row">
        <input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="answerPh" placeholder="">
      </div>
      <div class="umlauts" id="umlauts">
        <button>ä</button><button>ö</button><button>ü</button><button>ß</button><button>Ä</button><button>Ö</button><button>Ü</button>
      </div>

      <div class="actions">
        <button class="btn" id="hintBtn"><span data-icon="bulb"></span><span data-i18n="hintBtn"></span></button>
        <button class="btn quiet" id="revealBtn"><span data-icon="eye"></span><span data-i18n="revealBtn"></span></button>
        <span class="spacer"></span>
        <button class="btn" id="prevBtn"><span data-icon="left"></span><span data-i18n="prevBtn"></span></button>
        <button class="btn primary" id="nextBtn"><span id="nextLabel"></span><span data-icon="right"></span></button>

<script>
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const BUILTIN = (window.GP_LEVELS || []).flatMap(g => g.topics.map(t => ({ ...t, level: g.level })));

// ---------- storage (best effort) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// ---------- icons (Lucide, MIT) ----------
const ICONS = {
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  review: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/>',
  bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
document.querySelectorAll("[data-icon]").forEach(n => { n.outerHTML = ic(n.dataset.icon); });

// ---------- i18n ----------
const DICT = window.GP_I18N || {};
let lang = store.get("gp-lang", null) || ((navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh"
  : (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en");
function t(key, vars){
  const e = DICT[key]; let str = e ? (e[lang] ?? e.zh ?? key) : key;
  if (vars) Object.keys(vars).forEach(k => { str = str.replace("{" + k + "}", vars[k]); });
  return str;
}
function lvl(l){
  if (l.type === "video") return LEVELS.includes(l.level) ? l.level : t("video");
  if (l.custom) return t("customLvl");
  return l.level;
}
function topicSub(l){
  if (l.type === "video") return t("video");
  if (lang === "zh") return l.zh || "";
  if (lang === "en") return (window.GP_TOPIC_EN || {})[l.id] || "";
  return "";
}
function applyI18n(){
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.querySelectorAll("[data-i18n]").forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(n => { n.placeholder = t(n.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(n => { n.title = t(n.dataset.i18nTitle); });
}
let custom = store.get("gp-custom", []);
let progress = store.get("gp-progress", {});
const STATIC_VIDEOS = window.GP_VIDEOS || [];
const lvIdx = l => { const i = ["A1","A2","B1","B2","C1","C2"].indexOf(l.level); return i < 0 ? 99 : i; };
const mergeVideos = list => {
  const ids = new Set(STATIC_VIDEOS.map(v => v.id));
  return STATIC_VIDEOS.concat(list.filter(v => !ids.has(v.id))).sort((a, b) => lvIdx(a) - lvIdx(b));
};
let publicVideos = mergeVideos(store.get("gp-public", []));
let isPro = false, isAdmin = false;
// free monthly import quota (enforced again by Firestore rules)
const FREE_QUOTA = 3;
let signedIn = false, quotaUsed = 0, createLessonCloud = null;
const quotaLeft = () => Math.max(0, FREE_QUOTA - quotaUsed);
function canCreate(){
  if (canPro()) return true;
  if (!signedIn) { openUpgrade("signedOut"); return false; }
  if (quotaLeft() <= 0) { openUpgrade("quota"); return false; }
  return true;
}
const canPro = () => isPro || isAdmin;
let reviewLesson = null;   // built on demand, always last in lessons()
const lessons = () => BUILTIN.concat(publicVideos, custom, reviewLesson ? [reviewLesson] : []);
const findLesson = id => lessons().find(x => x.id === id);
function openLessonById(id, startAt){ const i = lessons().findIndex(x => x.id === id); if (i >= 0) openLesson(i, startAt); }

// ---------- mistake review (spaced repetition) ----------
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 14, 30];          // days for box 0..4; passing box 4 = mastered
const FREE_REVIEW_CAP = 20, SESSION_SIZE = 20;
let review = store.get("gp-review", {});       // "lessonId#idx" -> {box, due, last, lapses}
let stuckWords = store.get("gp-words", {});    // word -> times revealed by hint/answer
let mastered = store.get("gp-mastered", 0);
const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const dueItems = () => Object.entries(review).filter(([, e]) => e.due <= Date.now()).sort((a, b) => a[1].due - b[1].due);
function saveReview(){
  if (!canPro()){
    const keys = Object.keys(review).sort((a, b) => review[b].last - review[a].last);
    keys.slice(FREE_REVIEW_CAP).forEach(k => delete review[k]);
  }
  store.set("gp-review", review); store.set("gp-words", stuckWords); store.set("gp-mastered", mastered);
  syncHook("progress");
}
function updateReview(lessonId, idx, ok, inReview){
  const key = lessonId + "#" + idx, e = review[key], now = Date.now();
  if (!ok){
    review[key] = { box: 0, due: startOfToday() + INTERVALS[0] * DAY, last: now, lapses: (e?.lapses || 0) + 1 };
  } else if (e && (inReview || e.due <= now)){
    const box = e.box + 1;
    if (box >= INTERVALS.length){ delete review[key]; mastered++; }
    else review[key] = { ...e, box, due: startOfToday() + INTERVALS[box] * DAY, last: now };
  } else return;
  saveReview();
}
function buildReview(){
  const refs = [], sentences = [];
  for (const [key] of dueItems()){
    if (refs.length >= SESSION_SIZE) break;
    const cut = key.lastIndexOf("#"), id = key.slice(0, cut), idx = +key.slice(cut + 1);
    const src = findLesson(id);
    if (!src || !src.sentences[idx]) { delete review[key]; continue; }
    refs.push({ id, idx }); sentences.push(src.sentences[idx]);
  }
  return refs.length ? { id: "__review", type: "review", title: t("reviewTitle"), level: "", refs, sentences } : null;
}
function startReview(){
  reviewLesson = buildReview();
  if (!reviewLesson){ renderList(); return; }
  openLessonById("__review", 0);
}
function setPublicLessons(list){
  const cur = (lessons()[L] || {}).id;
  publicVideos = mergeVideos(list); store.set("gp-public", list);
  const ni = lessons().findIndex(x => x.id === cur);
  if (ni >= 0) L = ni;
  renderList();
}
function refreshPlanUI(){
  $("vPublicWrap").style.display = isAdmin ? "" : "none";
  renderList();
}
let syncHook = () => {};   // replaced by the Firebase module when signed in
function applyCloud(cloudProgress, cloudLessons, cloudExtra){
  const x = cloudExtra || {};
  Object.entries(x.review || {}).forEach(([k, e]) => { if (!review[k] || (e.last || 0) > (review[k].last || 0)) review[k] = e; });
  Object.entries(x.words || {}).forEach(([w, n]) => { stuckWords[w] = Math.max(stuckWords[w] || 0, n); });
  mastered = Math.max(mastered, x.mastered || 0);
  store.set("gp-review", review); store.set("gp-words", stuckWords); store.set("gp-mastered", mastered);
  // progress: union of completed sentence indexes
  Object.keys(cloudProgress || {}).forEach(k => {
    const set = new Set([...(progress[k] || []), ...(cloudProgress[k] || [])]);
    progress[k] = [...set].sort((a,b) => a-b);
  });
  const localIds = new Set(custom.map(c => c.id));
  const cloudIds = new Set(cloudLessons.map(c => c.id));
  const localOnly = custom.filter(c => !cloudIds.has(c.id));
  cloudLessons.forEach(c => { if (!localIds.has(c.id)) custom.push(c); });
  store.set("gp-progress", progress); store.set("gp-custom", custom);
  renderList();
  return localOnly;
}

// ---------- text helpers ----------
const WORD_RE = /[\p{L}\p{N}]+(?:[-'’][\p{L}\p{N}]+)*/gu;
const tokenize = s => s.match(WORD_RE) || [];
const deUml = w => w.replace(/’/g,"'").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
  .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function judge(typed, target){
  if (typed === target) return "ok";
  const a = deUml(typed), b = deUml(target);
  if (a === b) return "ok";
  if (a.toLowerCase() === b.toLowerCase()) return "case";
  return "bad";
}
function isPrefix(typed, target){
  return deUml(target).toLowerCase().startsWith(deUml(typed).toLowerCase());
}

// ---------- speech ----------
let voices = [], voice = null, rate = 1;
const voiceSel = document.getElementById("voiceSel");
function loadVoices(){
  if (!("speechSynthesis" in window)) { document.getElementById("voiceNotice").classList.add("show"); return; }
  voices = speechSynthesis.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
  const saved = store.get("gp-voice", null);
  voiceSel.innerHTML = voices.map((v,i) => `<option value="${i}">${esc(v.name)} (${v.lang})</option>`).join("") || `<option>${t("noVoice")}</option>`;
  let idx = voices.findIndex(v => v.name === saved);
  if (idx < 0) idx = voices.findIndex(v => /google|natural|online/i.test(v.name));
  if (idx < 0) idx = 0;
  voice = voices[idx] || null;
  if (voice) voiceSel.value = idx;
  document.getElementById("voiceNotice").classList.toggle("show", voices.length === 0);
}
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } else loadVoices();
voiceSel.onchange = () => { voice = voices[+voiceSel.value] || null; if (voice) store.set("gp-voice", voice.name); };
function speak(text, r){
  if (!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : "de-DE";
    if (voice) u.voice = voice;
    u.rate = r || rate;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- YouTube ----------
let ytReady = false, ytPlayer = null, ytPending = null, ytCurrent = null, segTimer = null;
function loadYT(){
  if (document.getElementById("yt-api")) return;
  const sc = document.createElement("script"); sc.id = "yt-api"; sc.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(sc);
}
window.onYouTubeIframeAPIReady = () => { ytReady = true; if (ytPending) { createPlayer(ytPending); ytPending = null; } };
function createPlayer(id){
  ytCurrent = id;
  ytPlayer = new YT.Player("ytPlayer", { videoId:id, playerVars:{ rel:0, playsinline:1, iv_load_policy:3, modestbranding:1 },
    events: { onError: e => { if ([2,5,100,101,150].includes(e.data)) $("videoErr").style.display = "flex"; } } });
}
function ensureVideo(id){
  $("videoArea").style.display = "";
  if (ytCurrent !== id) $("videoErr").style.display = "none";
  if (!ytReady){ ytPending = id; loadYT(); return; }
  if (!ytPlayer) createPlayer(id);
  else if (ytCurrent !== id){ ytCurrent = id; try{ ytPlayer.cueVideoById(id); }catch(e){} }
}
function hideVideo(){
  $("videoArea").style.display = "none";
  clearInterval(segTimer);
  try{ ytPlayer && ytPlayer.pauseVideo(); }catch(e){}
}
function nearestRate(r){
  const rates = [0.25,0.5,0.75,1,1.25];
  return rates.reduce((a,b) => Math.abs(b-r) < Math.abs(a-r) ? b : a);
}
function playSegment(start, end, r){
  if (!ytPlayer || !ytPlayer.seekTo) return;
  clearInterval(segTimer);
  try{
    ytPlayer.setPlaybackRate(nearestRate(r));
    ytPlayer.seekTo(Math.max(0, start - 0.05), true);
    ytPlayer.playVideo();
  }catch(e){ return; }
  const stopAt = end + 0.2;
  segTimer = setInterval(() => {
    try{
      if (ytPlayer.getCurrentTime() >= stopAt){ ytPlayer.pauseVideo(); clearInterval(segTimer); }
    }catch(e){ clearInterval(segTimer); }
  }, 80);
}
function playCurrent(r){
  let l = lessons()[L];
  if (l.type === "review"){ const ref = l.refs[S]; l = findLesson(ref.id) || l;
    if (l.type === "video"){ const s = l.sentences[ref.idx]; playSegment(s[2], s[3], r || rate); return; } }
  if (l.type === "video"){ const s = l.sentences[S]; playSegment(s[2], s[3], r || rate); }
  else speak(sess.de, r);
}

// ---------- subtitles ----------
function parseTime(t){
  const parts = t.trim().replace(",", ".").split(":").map(Number);
  return parts.reduce((a,p) => a*60 + p, 0);
}
function parseSubs(text){
  const out = [];
  text.replace(/\r/g, "").split(/\n\s*\n/).forEach(block => {
    const lines = block.split("\n").map(x => x.trim()).filter(Boolean);
    const i = lines.findIndex(x => x.includes("-->"));
    if (i < 0) return;
    const [a, b] = lines[i].split("-->");
    const start = parseTime(a), end = parseTime(b.trim().split(/\s+/)[0]);
    let txt = lines.slice(i+1).join(" ")
      .replace(/<[^>]+>/g, "").replace(/\{[^}]*\}/g, "")
      .replace(/\[[^\]]*\]|\([^)]*\)/g, "")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/^[-–]\s*/, "")
      .replace(/\s+/g, " ").trim();
    if (isNaN(start) || isNaN(end) || !tokenize(txt).length) return;
    const last = out[out.length-1];
    if (last && last.text === txt){ last.end = end; return; }
    out.push({ start, end, text: txt });
  });
  return out;
}
function mergeCues(cues){
  const out = []; let cur = null;
  cues.forEach(c => {
    if (cur && c.start - cur.end > 1.5){ out.push(cur); cur = null; }
    if (!cur) cur = { ...c }; else { cur.text += " " + c.text; cur.end = c.end; }
    if (/[.!?…]["»«“”']?$/.test(cur.text) || cur.end - cur.start > 12 || tokenize(cur.text).length > 22){ out.push(cur); cur = null; }
  });
  if (cur) out.push(cur);
  return out;
}
function parseYouTubeId(u){
  u = u.trim();
  if (/^[\w-]{11}$/.test(u)) return u;
  try{
    const x = new URL(u);
    if (x.hostname.includes("youtu.be")) return x.pathname.slice(1, 12);
    if (x.searchParams.get("v")) return x.searchParams.get("v");
    const m = x.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
    if (m) return m[2];
  }catch(e){}
  return null;
}

// ---------- state ----------
let L = 0, S = 0;
let sess = null; // per-sentence session
const $ = id => document.getElementById(id);
const answer = $("answer");

function lessonDone(id){ return progress[id] || []; }
function markDone(id, i, perfect){
  const arr = progress[id] || [];
  if (!arr.includes(i)) arr.push(i);
  progress[id] = arr; store.set("gp-progress", progress); syncHook("progress");
  if (perfect){ const k = id + "-perfect"; const p = progress[k] || []; if(!p.includes(i)) p.push(i); progress[k] = p; store.set("gp-progress", progress); }
}

let openState = store.get("gp-open", {});   // kept in memory so it works without storage
function renderList(){
  const all = lessons();
  const open = openState;
  const groups = LEVELS.map(lv => ({ key: lv, label: lv, items: [] }));
  groups.push({ key: "video", label: t("grpVideo"), icon: "film", items: [] }, { key: "mine", label: t("grpMine"), icon: "bookmark", items: [], mine: true });
  const byKey = k => groups.find(g => g.key === k);

function openSentence(){
  const l = lessons()[L];
  const [de, zh] = l.sentences[S];
  sess = { de, zh, words: tokenize(de), replays:0, hints:0, errSet:new Set(), revealed:false, complete:false, hinted:new Set() };
  if (l.type === "review"){ const src = findLesson(l.refs[S].id); if (src && src.type === "video") ensureVideo(src.videoId); else hideVideo(); }
  answer.value = ""; answer.classList.remove("done"); answer.disabled = false;

  $("prevBtn").disabled = S === 0;

  render(); answer.focus();
}

// Words can be typed in any order. Each typed word is matched to a slot of
// the sentence; matched slots reveal in place, the rest stay hidden.
function computeStatus(){
  const raw = answer.value;
  const typed = tokenize(raw);
  const trailing = /[\s.,!?;:]$/.test(raw);
  const T = sess.words;
  const status = new Array(T.length).fill(null);   // "ok" | {c: typedWord} | null
  sess.hinted.forEach(i => { status[i] = "ok"; });
  const used = new Array(typed.length).fill(false);
  const fin = j => j < typed.length - 1 || trailing;

  // pass 1: correct words (the word being typed counts once it is exactly right)
  let last = -1;
  typed.forEach((t, j) => {
    const cands = [];
    T.forEach((w, i) => { if (status[i] !== "ok" && judge(t, w) === "ok") cands.push(i); });
    if (!cands.length) return;
    const i = cands.find(k => k > last) ?? cands[0];   // prefer keeping the typed order
    status[i] = "ok"; used[j] = true; last = i;
  });
  // pass 2: finished words that only differ in capitalization
  typed.forEach((t, j) => {
    if (used[j] || !fin(j)) return;
    const i = T.findIndex((w, k) => status[k] == null && judge(t, w) === "case");
    if (i >= 0) { status[i] = { c: t }; used[j] = true; return; }
    if (T.some(w => judge(t, w) !== "bad")) used[j] = true;   // repeat of a word already revealed
  });
  const misses = typed.filter((t, j) => !used[j] && fin(j));
  return { status, misses };
}

function render(){
  const { status, misses } = computeStatus();
  misses.forEach(t => sess.errSet.add(t.toLowerCase()));
  $("words").innerHTML = sess.words.map((w, i) => {
    const st = status[i];
    if (st === "ok") return `<span class="w ok">${esc(w)}</span>`;
    if (st && st.c) return `<span class="w case">${esc(st.c)}</span>`;
    // one short line per letter so the learner can count letters; keep - and ' visible (E-Mail → _-____)
    return `<span class="w empty">${[...w].map(c => /[\p{L}\p{N}]/u.test(c) ? "<i></i>" : `<b>${esc(c)}</b>`).join("")}</span>`;
  }).join("");
  $("misses").innerHTML = misses.length
    ? `${t("missing")}${misses.map(t => `<span class="w bad">${esc(t)}</span>`).join("")}` : "";
  $("sReplay").textContent = sess.replays;
  $("sHint").textContent = sess.hints;
  $("sErr").textContent = sess.errSet.size;
  if (status.every(x => x === "ok") && !sess.complete) complete();
}

function complete(){
  sess.complete = true;
  answer.classList.add("done");
  const perfect = !sess.revealed && sess.hints === 0 && sess.errSet.size === 0;
  const cl = lessons()[L];
  if (cl.type === "review") updateReview(cl.refs[S].id, cl.refs[S].idx, perfect, true);
  else { markDone(cl.id, S, perfect); updateReview(cl.id, S, perfect, false); }
  const label = t(sess.revealed ? "bRevealed" : perfect ? "bPerfect" : "bDone");
  const fb = $("feedback");
  fb.innerHTML = `<span class="badge ${perfect?"":"meh"}">${perfect ? ic("check") : ""}${label}</span>
    <div class="de">${esc(sess.de)}</div>${sess.zh && lang === "zh" ? `<div class="zh">${esc(sess.zh)}</div>` : ""}`;
  fb.classList.add("show");
  $("progBar").style.width = `${(S+1) / lessons()[L].sentences.length * 100}%`;
  renderList();
}

function next(){
  const l = lessons()[L];
  if (S < l.sentences.length - 1){ S++; openSentence(); playCurrent(); }
  else showSummary();
}
function prev(){ if (S > 0){ S--; openSentence(); } }

function hint(){
  if (sess.complete) return;
  const { status } = computeStatus();
  const i = status.findIndex(x => x !== "ok");
  if (i < 0) return;
  sess.hints++; sess.hinted.add(i);
  const w = sess.words[i].toLowerCase(); stuckWords[w] = (stuckWords[w] || 0) + 1;
  answer.focus(); render();
}
function reveal(){
  if (sess.complete) return;
  sess.revealed = true;
  const { status } = computeStatus();
  sess.words.forEach((w, i) => { if (status[i] !== "ok"){ const k = w.toLowerCase(); stuckWords[k] = (stuckWords[k] || 0) + 1; } sess.hinted.add(i); });
  render();
}

function showSummary(){
  const l = lessons()[L];

    <div class="nums"><div><b>${d}/${n}</b><span>${t("sumSent")}</span></div><div><b>${p}</b><span>${t("sumPerfect")}</span></div></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="redo">${t("redo")}</button>
      ${hasNext ? `<button class="btn primary" id="nextLesson">${t("nextLesson")}</button>` : ""}
    </div>`;
  $("redo").onclick = () => { progress[l.id] = []; progress[l.id+"-perfect"] = []; store.set("gp-progress", progress); syncHook("progress"); openLesson(L, 0); };
  if (hasNext) $("nextLesson").onclick = () => openLesson(L+1);
  $("progBar").style.width = "100%";
}

// ---------- cloud data ----------
const toCloud = l => ({
  id: l.id, title: l.title, level: l.level, type: l.type || "text", videoId: l.videoId || null, createdAt: Date.now(),
  sentences: l.sentences.map(x => ({ de: x[0], zh: x[1] || "", s: x[2] ?? null, e: x[3] ?? null }))
});
const fromCloud = d => ({
  id: d.id, title: d.title, level: d.level, custom: true,
  ...(d.type === "video" ? { type: "video", videoId: d.videoId } : {}),
  sentences: (d.sentences || []).map(x => x.s == null ? [x.de, x.zh || ""] : [x.de, x.zh || "", x.s, x.e])
});
const userRef = () => F.doc(db, "users", user.uid);
const lessonRef = id => F.doc(db, "users", user.uid, "lessons", id);

let pending = 0;
function busy(delta){
  pending += delta;
  syncState.textContent = t(pending > 0 ? "syncing" : "synced");
}
async function guarded(fn){
  busy(1);
  try { await fn(); } catch (e) { console.error(e); syncState.textContent = t("syncFail"); pending = Math.max(0, pending-1); return; }
  busy(-1);
}
let progTimer = null;
function saveProgressSoon(){
  clearTimeout(progTimer);
  progTimer = setTimeout(() => guarded(() =>
    F.setDoc(userRef(), { progress, review, words: stuckWords, mastered, email: user.email || null, updatedAt: F.serverTimestamp() }, { merge: true })), 800);
}

const monthKey = () => { const d = new Date(); return String(d.getUTCFullYear() * 100 + d.getUTCMonth() + 1); };
const usageRef = () => F.doc(db, "users", user.uid, "usage", monthKey());
async function loadUsage(){
  try { const u = await F.getDoc(usageRef()); quotaUsed = u.exists() ? (u.data().count || 0) : 0; } catch (e) { quotaUsed = 0; }
}
async function createWithQuota(lesson){
  try {
    const snap = await F.getDoc(usageRef());
    const used = snap.exists() ? (snap.data().count || 0) : 0;
    if (used >= FREE_QUOTA) { quotaUsed = used; renderList(); return false; }
    const b = F.writeBatch(db);
    b.set(lessonRef(lesson.id), toCloud(lesson));
    b.set(usageRef(), { count: used + 1 });
    await b.commit();
    quotaUsed = used + 1; renderList();
    return true;
  } catch (e) { console.error(e); return false; }
}
async function loadPlan(){
  isPro = false; isAdmin = false;
  try { const e = await F.getDoc(F.doc(db, "entitlements", user.uid)); isPro = e.exists() && e.data().pro === true; } catch (e) {}
  try { const a = await F.getDoc(F.doc(db, "admins", user.uid)); isAdmin = a.exists(); } catch (e) {}
  if (!isPro && !isAdmin) await loadUsage();
  refreshPlanUI();
}
async function loadPublic(){
  try {
    const ls = await F.getDocs(F.collection(db, "publicLessons"));
    const list = ls.docs.map(d => d.data()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
      .map(d => ({ ...fromCloud(d), custom: false, public: true }));
    setPublicLessons(list);
  } catch (e) { console.error(e); }
}

async function pullAndMerge(){
  await guarded(async () => {
    const snap = await F.getDoc(userRef());
    const cloudProgress = snap.exists() ? (snap.data().progress || {}) : {};
    const ls = await F.getDocs(F.collection(db, "users", user.uid, "lessons"));
    const cloudLessons = ls.docs.map(d => fromCloud(d.data()));
    const d = snap.exists() ? snap.data() : {};
    const localOnly = applyCloud(cloudProgress, cloudLessons, { review: d.review, words: d.words, mastered: d.mastered });
    if (canPro()) await Promise.all(localOnly.map(l => F.setDoc(lessonRef(l.id), toCloud(l))));
    await F.setDoc(userRef(), { progress, review, words: stuckWords, mastered, email: user.email || null, updatedAt: F.serverTimestamp() }, { merge: true });
  });
}

function hook(kind, arg){
  if (!user) return;
  if (kind === "progress") saveProgressSoon();
  else if (kind === "lesson") { if (canPro()) guarded(() => F.setDoc(lessonRef(arg.id), toCloud(arg))); }
  else if (kind === "delete") guarded(() => F.deleteDoc(lessonRef(arg)));
  else if (kind === "public") guarded(async () => { await F.setDoc(F.doc(db, "publicLessons", arg.id), toCloud(arg)); await loadPublic(); });
  else if (kind === "deletePublic") guarded(async () => { await F.deleteDoc(F.doc(db, "publicLessons", arg)); await loadPublic(); });
}

// ---------- auth UI ----------
if (auth) {
  loadPublic();
  el("aSwitch").onclick = () => setMode(mode === "login" ? "register" : "login");
  el("aGoogle").onclick = async () => {
    const provider = new A.GoogleAuthProvider();
    try { await A.signInWithPopup(auth, provider); el("amodal").classList.remove("show"); }
    catch (e) {
      if (e.code === "auth/popup-blocked") { try { await A.signInWithRedirect(auth, provider); } catch (e2) { showErr(e2); } }
      else showErr(e);
    }
  };
  el("aSubmit").onclick = async () => {
    const email = el("aEmail").value.trim(), pass = el("aPass").value;
    if (!email || !pass) { el("aErr").textContent = t("errEmailPass"); return; }
    el("aSubmit").disabled = true;
    try {
      if (mode === "login") await A.signInWithEmailAndPassword(auth, email, pass);
      else {
        const cred = await A.createUserWithEmailAndPassword(auth, email, pass);
        const name = el("aName").value.trim();
        if (name) await A.updateProfile(cred.user, { displayName: name });
        A.sendEmailVerification(cred.user).catch(() => {});
      }
      el("aPass").value = "";
      el("amodal").classList.remove("show");
    } catch (e) { showErr(e); }
    el("aSubmit").disabled = false;
  };
  el("aPass").addEventListener("keydown", e => { if (e.key === "Enter") el("aSubmit").click(); });
  el("aForgot").onclick = async () => {
    const email = el("aEmail").value.trim();
    if (!email) { el("aErr").textContent = t("errForgot"); return; }
    try { await A.sendPasswordResetEmail(auth, email); showOk(t("resetSent")); }
    catch (e) { showErr(e); }
  };
  el("aLogout").onclick = async () => { await A.signOut(auth); el("amodal").classList.remove("show"); };

  A.getRedirectResult(auth).catch(() => {});
  window.addEventListener("gp-lang", () => {
    if (user) renderUser(); else { authBtn.innerHTML = ic("user") + `<span>${t("login")}</span>`; setMode(mode); }
    if (syncState.textContent) syncState.textContent = t(pending > 0 ? "syncing" : "synced");
  });
  A.onAuthStateChanged(auth, async u => {
    user = u;
    if (u) {
      const name = u.displayName || (u.email || "").split("@")[0];
      authBtn.innerHTML = ic("user") + `<span>${esc(name)}</span>`;
      renderUser();
      el("aGuest").style.display = "none"; el("aUser").style.display = "";
      syncHook = hook;
      signedIn = true; createLessonCloud = createWithQuota;
      await loadPlan();
      renderUser();
      await pullAndMerge();
    } else {
      syncHook = () => {};
      isPro = false; isAdmin = false; signedIn = false; quotaUsed = 0; createLessonCloud = null; refreshPlanUI();
      authBtn.innerHTML = ic("user") + `<span>${t("login")}</span>`;
      syncState.textContent = "";
      el("aGuest").style.display = ""; el("aUser").style.display = "none";
      setMode("login");
    }
  });
}
</script>
