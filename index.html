<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Parrot 德文聽寫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e5e1d8;
    --field:#ffffff; --hover:#f3f1ec; --soft:#fbfaf7; --track:#ece8df; --placeholder:#9aa0a6;
    --accent:#1f6f5c; --accent-soft:#e3f1ec; --accent-line:#bfe0d4;
    --ok:#2f9e62; --ok-bg:#f3fbf6; --bad:#d9483b; --bad-bg:#fdecea; --case:#8e5bd8; --case-bg:#f2ecfb; --typing:#b7791f;
    --empty:#b9b3a6; --rest:#cfc8b8;
    --notice-bg:#fff7e6; --notice-line:#f2d9a6; --notice-ink:#7a5a12;
    --shadow:rgba(31,111,92,.25); --overlay:rgba(20,20,20,.35);
    --radius:14px;
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --bg:#121417; --card:#1b1e23; --ink:#e8e6e1; --muted:#9aa1ab; --line:#2e333a;
    --field:#23272e; --hover:#262b32; --soft:#171a1e; --track:#2a2f36; --placeholder:#6f7780;
    --accent:#3fb28f; --accent-soft:#1c3a32; --accent-line:#2b5a4c;
    --ok:#4cc488; --ok-bg:#16291f; --bad:#ff6b5e; --bad-bg:#3a1d1b; --case:#b48cff; --case-bg:#2c2240; --typing:#e0a83a;
    --empty:#5b616a; --rest:#4a5058;
    --notice-bg:#2e2716; --notice-line:#5a4a22; --notice-ink:#f0d590;
    --shadow:rgba(0,0,0,.4); --overlay:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;line-height:1.5;transition:background .2s,color .2s}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:18px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .head-right{display:flex;align-items:center;gap:12px}
  .voice-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);max-width:220px}
  .lang-sel{font-size:13px;padding:5px 8px;border-radius:999px}
  .theme-btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink);cursor:pointer;white-space:nowrap}
  .theme-btn:hover{background:var(--hover)}
  .layout{display:grid;grid-template-columns:260px 1fr;gap:20px;max-width:1100px;margin:20px auto;padding:0 20px}
  @media (max-width:820px){.layout{grid-template-columns:1fr} .voice-wrap span{display:none}}
  aside .card{padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  .side-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 4px 10px}
  .lesson{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;color:inherit;margin-bottom:4px}
  .lesson:hover{background:var(--hover)}
  .lesson.active{background:var(--accent-soft);border-color:var(--accent-line)}
  .lesson .name{font-weight:600;font-size:14px}
  .lesson .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
  .mini-bar{height:4px;background:var(--track);border-radius:4px;margin-top:6px;overflow:hidden}
  .mini-bar i{display:block;height:100%;background:var(--ok);width:0}
  .add-btn{width:100%;margin-top:8px;font-size:13px}
  .group{margin-bottom:4px}
  .group-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:8px 6px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;border-radius:8px;text-align:left}
  .group-h:hover{background:var(--hover)}
  .chev{width:12px;color:var(--muted);font-size:12px}
  .g-name{flex:1}
  .g-count{font-size:12px;font-weight:500;color:var(--muted)}
  .group-b{padding:2px 0 8px 8px}
  .empty-note{font-size:12px;color:var(--muted);padding:4px 6px}
  main .card{padding:24px}
  .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .lesson-title{font-size:20px;font-weight:700;margin:0}
  .counter{font-size:13px;color:var(--muted)}
  .progress{height:6px;background:var(--track);border-radius:6px;margin:14px 0 22px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .player{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .play{width:64px;height:64px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px var(--shadow)}
  .play:hover{filter:brightness(1.08)}
  .speeds{display:flex;gap:6px}
  .chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .stats{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:14px}
  .words{min-height:84px;margin:24px 0 16px;padding:16px;border:1px dashed var(--line);border-radius:12px;background:var(--soft);font-family:"JetBrains Mono",monospace;font-size:19px;line-height:2.1}
  .w{display:inline-block;margin:0 6px 0 0;padding:0 3px;border-radius:5px;white-space:pre}
  .w.empty{color:var(--empty);letter-spacing:.12em}
  .w.ok{color:var(--ok)}
  .w.case{color:var(--case);background:var(--case-bg)}
  .w.bad{color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-thickness:1px}
  .w.typing{color:var(--typing)}
  .w.typing .rest{color:var(--rest);letter-spacing:.12em}
  .w.extra{color:var(--bad);background:var(--bad-bg)}
  .misses{margin:-6px 0 14px;font-size:13px;color:var(--muted);min-height:0}
  .misses .w{margin-left:6px}
  .input-row{position:relative}
  input.answer{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;outline:none;background:var(--field);color:var(--ink);caret-color:var(--accent)}
  input.answer::placeholder{color:var(--placeholder)}
  input.answer:focus{border-color:var(--accent)}
  input.answer.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
  .umlauts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .umlauts button{font:inherit;font-weight:600;width:40px;height:36px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;cursor:pointer}
  .umlauts button:hover{background:var(--hover)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .feedback{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);display:none}
  .feedback.show{display:block}
  .feedback .de{font-weight:600}
  .feedback .zh{color:var(--muted);margin-top:4px}
  .feedback .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok);color:#fff;margin-bottom:6px}
  .feedback .badge.meh{background:var(--typing)}
  .keys{margin-top:18px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  kbd{font-family:"JetBrains Mono",monospace;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--field);color:var(--ink)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
  .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--c)}
  .notice{background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-ink);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .notice.show{display:block}
  .summary{text-align:center;padding:20px 0}
  .summary h2{margin:0 0 6px}
  .summary .nums{display:flex;justify-content:center;gap:28px;margin:22px 0}
  .summary .nums b{display:block;font-size:28px}
  .summary .nums span{font-size:12px;color:var(--muted)}
  .modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(560px,100%)}
  .modal h3{margin:0 0 6px}
  .modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .modal input,.modal textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--field);color:var(--ink)}
  .modal input::placeholder,.modal textarea::placeholder{color:var(--placeholder)}
  .modal textarea{min-height:160px;resize:vertical}
  .modal .row{display:flex;justify-content:flex-end;gap:8px}
  .video-wrap{position:relative;aspect-ratio:16/9;width:100%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px}
  .video-wrap iframe,.video-wrap #ytPlayer{position:absolute;inset:0;width:100%;height:100%;border:0}
  .cc-cover{position:absolute;left:0;right:0;bottom:11%;height:19%;background:rgba(0,0,0,.92);pointer-events:none;display:flex;align-items:center;justify-content:center;color:#777;font-size:12px}
  .video-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:12px;color:var(--muted)}
  .modal label{display:block;font-size:13px;font-weight:600;margin:4px 0 6px}
  .modal .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .modal input[type=checkbox]{width:auto;margin:0}
  .modal input[type=file]{padding:8px}
  .check{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:12px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
  .google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:12px}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:4px 0 12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .link{background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer}
  .link:hover{text-decoration:underline}
  .auth-links{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .sync{font-size:12px;color:var(--muted)}
  .ok-msg{color:var(--ok)}
  .del{font-size:11px;color:var(--bad);background:none;border:none;cursor:pointer;padding:0}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">🦜</div><div>German Parrot<small data-i18n="tagline">德文逐句聽寫</small></div></div>
  <div class="head-right"><div class="voice-wrap"><span data-i18n="voice">語音</span> <select id="voiceSel"></select></div><select id="langSel" class="lang-sel" aria-label="Language"></select><button class="theme-btn" id="themeBtn">🌙 夜間</button><span class="sync" id="syncState"></span><button class="theme-btn" id="authBtn">登入</button></div>
</header>

<div class="layout">
  <aside>
    <div class="card">
      <div class="side-title" data-i18n="lessons">課程</div>
      <div id="lessonList"></div>
    </div>
  </aside>

  <main>
    <div class="notice" id="voiceNotice" data-i18n="voiceNotice">這個瀏覽器找不到德文語音。建議用 Chrome 或 Edge 開啟；macOS 可到「系統設定 → 輔助使用 → 朗讀內容」下載德文語音（例如 Anna）。</div>
    <div class="card" id="practice">
      <div class="top-row">
        <h1 class="lesson-title" id="lessonTitle"></h1>
        <div class="counter" id="counter"></div>
      </div>
      <div class="progress"><i id="progBar"></i></div>
      <div id="videoArea" style="display:none">
        <div class="video-wrap"><div id="ytPlayer"></div><div class="cc-cover" id="ccCover" data-i18n="ccCover">字幕遮罩</div></div>
        <div class="video-tools"><button class="chip on" id="ccBtn" data-i18n="ccBtn">遮住字幕</button><span data-i18n="videoTip"></span></div>
      </div>

      <div class="player">
        <button class="play" id="playBtn" data-i18n-title="playTitle" title="播放 (Space)">▶</button>
        <div>
          <div class="speeds" id="speeds">
            <button class="chip" data-rate="0.6">0.6×</button>
            <button class="chip" data-rate="0.8">0.8×</button>
            <button class="chip on" data-rate="1">1.0×</button>
          </div>
          <div class="legend">
            <span style="--c:var(--ok)" data-i18n="lgOk">正確</span>
            <span style="--c:var(--case)" data-i18n="lgCase">大小寫錯</span>
            <span style="--c:var(--bad)" data-i18n="lgBad">拼錯</span>
            <span style="--c:var(--typing)" data-i18n="lgTyping">輸入中</span>
          </div>
        </div>
        <div class="stats"><span><span data-i18n="stReplay">重播</span> <b id="sReplay">0</b></span><span><span data-i18n="stHint">提示</span> <b id="sHint">0</b></span><span><span data-i18n="stErr">錯字</span> <b id="sErr">0</b></span></div>
      </div>

      <div class="words" id="words"></div>
      <div class="misses" id="misses"></div>

      <div class="input-row">
        <input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="answerPh" placeholder="">
      </div>
      <div class="umlauts" id="umlauts">
        <button>ä</button><button>ö</button><button>ü</button><button>ß</button><button>Ä</button><button>Ö</button><button>Ü</button>
      </div>

      <div class="actions">
        <button class="btn" id="hintBtn" data-i18n="hintBtn">提示下一個字</button>
        <button class="btn" id="revealBtn" data-i18n="revealBtn">顯示答案</button>
        <button class="btn" id="prevBtn" data-i18n="prevBtn">← 上一句</button>
        <button class="btn primary" id="nextBtn">下一句 →</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="keys">
        <span><kbd>Space</kbd> <span data-i18n="keySpace"></span></span>
        <span><kbd>Enter</kbd> <span data-i18n="keyEnter"></span></span>
        <span><kbd>Shift</kbd>+<kbd>Enter</kbd> <span data-i18n="keyHint"></span></span>
        <span><kbd>Esc</kbd> <span data-i18n="keySlow"></span></span>
        <span data-i18n="keyOrder"></span>
        <span data-i18n="keyUml"></span>
      </div>
    </div>

    <div class="card summary" id="summary" style="display:none"></div>
  </main>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 data-i18n="ctTitle"></h3>
    <p data-i18n="ctDesc"></p>
    <input id="customTitle" data-i18n-ph="ctTitlePh">
    <textarea id="customText" placeholder="Heute ist das Wetter schön. Wir gehen in den Park."></textarea>
    <div class="row">
      <button class="btn" id="cancelCustom" data-i18n="cancel"></button>
      <button class="btn primary" id="saveCustom" data-i18n="ctSave"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="amodal">
  <div class="modal">
    <div id="aGuest">
      <h3 id="aTitle">登入 German Parrot</h3>
      <p data-i18n="aDesc"></p>
      <button class="btn google" id="aGoogle">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span data-i18n="aGoogle"></span>
      </button>
      <div class="or" data-i18n="aOr"></div>
      <input id="aName" data-i18n-ph="aName" style="display:none">
      <input id="aEmail" type="email" data-i18n-ph="aEmail" autocomplete="email">
      <input id="aPass" type="password" data-i18n-ph="aPass" autocomplete="current-password">
      <div class="err" id="aErr"></div>
      <div class="auth-links">
        <button class="link" id="aSwitch">還沒有帳號？註冊</button>
        <button class="link" id="aForgot" data-i18n="aForgot"></button>
      </div>
      <div class="row">
        <button class="btn" id="aCancel" data-i18n="cancel"></button>
        <button class="btn primary" id="aSubmit">登入</button>
      </div>
    </div>
    <div id="aUser" style="display:none">
      <h3 data-i18n="myAccount"></h3>
      <p id="aInfo"></p>
      <div class="row">
        <button class="btn" id="aLogout" data-i18n="logout"></button>
        <button class="btn primary" id="aClose" data-i18n="close"></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="umodal">
  <div class="modal">
    <h3 data-i18n="proTitle"></h3>
    <p id="uText"></p>
    <div class="row">
      <button class="btn" id="uClose" data-i18n="gotIt"></button>
      <button class="btn primary" id="uLogin" data-i18n="login"></button>
    </div>
  </div>
</div>

<div class="modal-bg" id="vmodal">
  <div class="modal">
    <h3 data-i18n="vTitle"></h3>
    <p data-i18n="vDesc"></p>
    <label data-i18n="vUrl"></label>
    <input id="vUrl" placeholder="https://www.youtube.com/watch?v=...">
    <label data-i18n="vName"></label>
    <input id="vTitle" data-i18n-ph="vNamePh">
    <label data-i18n="vFile"></label>
    <input type="file" id="vFile" accept=".srt,.vtt,.txt">
    <div class="hint" data-i18n="vPasteHint"></div>
    <textarea id="vSubs" placeholder="1&#10;00:00:01,000 --> 00:00:03,500&#10;Hallo und willkommen!"></textarea>
    <label class="check"><input type="checkbox" id="vMerge" checked> <span data-i18n="vMerge"></span></label>
    <label class="check" id="vPublicWrap" style="display:none"><input type="checkbox" id="vPublic"> <span data-i18n="vPublic"></span></label>
    <div class="err" id="vErr"></div>
    <div class="row">
      <button class="btn" id="vCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="vSave" data-i18n="vSave"></button>
    </div>
  </div>
</div>

<script src="lessons.js"></script>
<script src="i18n.js"></script>
<script>
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const BUILTIN = (window.GP_LEVELS || []).flatMap(g => g.topics.map(t => ({ ...t, level: g.level })));

// ---------- storage (best effort) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// ---------- i18n ----------
const DICT = window.GP_I18N || {};
let lang = store.get("gp-lang", null) || ((navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh"
  : (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en");
function t(key, vars){
  const e = DICT[key]; let str = e ? (e[lang] ?? e.zh ?? key) : key;
  if (vars) Object.keys(vars).forEach(k => { str = str.replace("{" + k + "}", vars[k]); });
  return str;
}
function lvl(l){
  if (l.type === "video") return t("video");
  if (l.custom) return t("customLvl");
  return l.level;
}
function topicSub(l){
  if (l.type === "video") return t("video");
  if (lang === "zh") return l.zh || "";
  if (lang === "en") return (window.GP_TOPIC_EN || {})[l.id] || "";
  return "";
}
function applyI18n(){

  document.querySelectorAll("[data-i18n]").forEach(n => { n.textContent = t(n.dataset.i18n); });

let syncHook = () => {};   // replaced by the Firebase module when signed in
function applyCloud(cloudProgress, cloudLessons){
  // progress: union of completed sentence indexes
  Object.keys(cloudProgress || {}).forEach(k => {
    const set = new Set([...(progress[k] || []), ...(cloudProgress[k] || [])]);
    progress[k] = [...set].sort((a,b) => a-b);
  });
  const localIds = new Set(custom.map(c => c.id));
  const cloudIds = new Set(cloudLessons.map(c => c.id));
  const localOnly = custom.filter(c => !cloudIds.has(c.id));
  cloudLessons.forEach(c => { if (!localIds.has(c.id)) custom.push(c); });
  store.set("gp-progress", progress); store.set("gp-custom", custom);
  renderList();
  return localOnly;
}

// ---------- text helpers ----------
const WORD_RE = /[\p{L}\p{N}]+(?:[-'’][\p{L}\p{N}]+)*/gu;
const tokenize = s => s.match(WORD_RE) || [];
const deUml = w => w.replace(/’/g,"'").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
  .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function judge(typed, target){
  if (typed === target) return "ok";
  const a = deUml(typed), b = deUml(target);
  if (a === b) return "ok";
  if (a.toLowerCase() === b.toLowerCase()) return "case";
  return "bad";
}
function isPrefix(typed, target){
  return deUml(target).toLowerCase().startsWith(deUml(typed).toLowerCase());
}

// ---------- speech ----------
let voices = [], voice = null, rate = 1;
const voiceSel = document.getElementById("voiceSel");
function loadVoices(){
  if (!("speechSynthesis" in window)) { document.getElementById("voiceNotice").classList.add("show"); return; }
  voices = speechSynthesis.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
  const saved = store.get("gp-voice", null);
  voiceSel.innerHTML = voices.map((v,i) => `<option value="${i}">${esc(v.name)} (${v.lang})</option>`).join("") || `<option>${t("noVoice")}</option>`;
  let idx = voices.findIndex(v => v.name === saved);
  if (idx < 0) idx = voices.findIndex(v => /google|natural|online/i.test(v.name));
  if (idx < 0) idx = 0;
  voice = voices[idx] || null;
  if (voice) voiceSel.value = idx;
  document.getElementById("voiceNotice").classList.toggle("show", voices.length === 0);
}
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } else loadVoices();
voiceSel.onchange = () => { voice = voices[+voiceSel.value] || null; if (voice) store.set("gp-voice", voice.name); };
function speak(text, r){
  if (!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : "de-DE";
    if (voice) u.voice = voice;
    u.rate = r || rate;
    speechSynthesis.speak(u);
  }catch(e){}
}

let ytReady = false, ytPlayer = null, ytPending = null, ytCurrent = null, segTimer = null;
function loadYT(){
  if (document.getElementById("yt-api")) return;
  const sc = document.createElement("script"); sc.id = "yt-api"; sc.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(sc);
}
window.onYouTubeIframeAPIReady = () => { ytReady = true; if (ytPending) { createPlayer(ytPending); ytPending = null; } };
function createPlayer(id){
  ytCurrent = id;
  ytPlayer = new YT.Player("ytPlayer", { videoId:id, playerVars:{ rel:0, playsinline:1, iv_load_policy:3, modestbranding:1 } });
}
function ensureVideo(id){
  $("videoArea").style.display = "";
  if (!ytReady){ ytPending = id; loadYT(); return; }
  if (!ytPlayer) createPlayer(id);
  else if (ytCurrent !== id){ ytCurrent = id; try{ ytPlayer.cueVideoById(id); }catch(e){} }
}
function hideVideo(){
  $("videoArea").style.display = "none";
  clearInterval(segTimer);
  try{ ytPlayer && ytPlayer.pauseVideo(); }catch(e){}
}
function nearestRate(r){
  const rates = [0.25,0.5,0.75,1,1.25];
  return rates.reduce((a,b) => Math.abs(b-r) < Math.abs(a-r) ? b : a);
}
function playSegment(start, end, r){
  if (!ytPlayer || !ytPlayer.seekTo) return;
  clearInterval(segTimer);
  try{
    ytPlayer.setPlaybackRate(nearestRate(r));
    ytPlayer.seekTo(Math.max(0, start - 0.05), true);
    ytPlayer.playVideo();
  }catch(e){ return; }
  const stopAt = end + 0.2;
  segTimer = setInterval(() => {
    try{
      if (ytPlayer.getCurrentTime() >= stopAt){ ytPlayer.pauseVideo(); clearInterval(segTimer); }
    }catch(e){ clearInterval(segTimer); }
  }, 80);
}
function playCurrent(r){
  const l = lessons()[L];
  if (l.type === "video"){ const s = l.sentences[S]; playSegment(s[2], s[3], r || rate); }
  else speak(sess.de, r);
}

// ---------- subtitles ----------
function parseTime(t){
  const parts = t.trim().replace(",", ".").split(":").map(Number);
  return parts.reduce((a,p) => a*60 + p, 0);
}
function parseSubs(text){
  const out = [];
  text.replace(/\r/g, "").split(/\n\s*\n/).forEach(block => {
    const lines = block.split("\n").map(x => x.trim()).filter(Boolean);
    const i = lines.findIndex(x => x.includes("-->"));
    if (i < 0) return;
    const [a, b] = lines[i].split("-->");
    const start = parseTime(a), end = parseTime(b.trim().split(/\s+/)[0]);
    let txt = lines.slice(i+1).join(" ")
      .replace(/<[^>]+>/g, "").replace(/\{[^}]*\}/g, "")
      .replace(/\[[^\]]*\]|\([^)]*\)/g, "")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/^[-–]\s*/, "")
      .replace(/\s+/g, " ").trim();
    if (isNaN(start) || isNaN(end) || !tokenize(txt).length) return;
    const last = out[out.length-1];
    if (last && last.text === txt){ last.end = end; return; }
    out.push({ start, end, text: txt });
  });
  return out;
}
function mergeCues(cues){
  const out = []; let cur = null;
  cues.forEach(c => {
    if (cur && c.start - cur.end > 1.5){ out.push(cur); cur = null; }
    if (!cur) cur = { ...c }; else { cur.text += " " + c.text; cur.end = c.end; }
    if (/[.!?…]["»«“”']?$/.test(cur.text) || cur.end - cur.start > 12 || tokenize(cur.text).length > 22){ out.push(cur); cur = null; }
  });
  if (cur) out.push(cur);
  return out;
}
function parseYouTubeId(u){
  u = u.trim();
  if (/^[\w-]{11}$/.test(u)) return u;
  try{
    const x = new URL(u);
    if (x.hostname.includes("youtu.be")) return x.pathname.slice(1, 12);
    if (x.searchParams.get("v")) return x.searchParams.get("v");
    const m = x.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
    if (m) return m[2];
  }catch(e){}
  return null;
}

function openSentence(){
  const l = lessons()[L];

  $("progBar").style.width = `${S / l.sentences.length * 100}%`;
  $("prevBtn").disabled = S === 0;

  render(); answer.focus();
}

// Words can be typed in any order. Each typed word is matched to a slot of
// the sentence; matched slots reveal in place, the rest stay hidden.
function computeStatus(){
  const raw = answer.value;
  const typed = tokenize(raw);
  const trailing = /[\s.,!?;:]$/.test(raw);
  const T = sess.words;
  const status = new Array(T.length).fill(null);   // "ok" | {c: typedWord} | null
  sess.hinted.forEach(i => { status[i] = "ok"; });
  const used = new Array(typed.length).fill(false);
  const fin = j => j < typed.length - 1 || trailing;

  // pass 1: correct words (the word being typed counts once it is exactly right)
  let last = -1;
  typed.forEach((t, j) => {
    const cands = [];
    T.forEach((w, i) => { if (status[i] !== "ok" && judge(t, w) === "ok") cands.push(i); });
    if (!cands.length) return;
    const i = cands.find(k => k > last) ?? cands[0];   // prefer keeping the typed order
    status[i] = "ok"; used[j] = true; last = i;
  });
  // pass 2: finished words that only differ in capitalization
  typed.forEach((t, j) => {
    if (used[j] || !fin(j)) return;
    const i = T.findIndex((w, k) => status[k] == null && judge(t, w) === "case");
    if (i >= 0) { status[i] = { c: t }; used[j] = true; return; }
    if (T.some(w => judge(t, w) !== "bad")) used[j] = true;   // repeat of a word already revealed
  });
  const misses = typed.filter((t, j) => !used[j] && fin(j));
  return { status, misses };
}

function render(){
  const { status, misses } = computeStatus();
  misses.forEach(t => sess.errSet.add(t.toLowerCase()));
  $("words").innerHTML = sess.words.map((w, i) => {
    const st = status[i];
    if (st === "ok") return `<span class="w ok">${esc(w)}</span>`;
    if (st && st.c) return `<span class="w case">${esc(st.c)}</span>`;
    return `<span class="w empty">${"_".repeat(w.length)}</span>`;
  }).join("");
  $("misses").innerHTML = misses.length
    ? `${t("missing")}${misses.map(t => `<span class="w bad">${esc(t)}</span>`).join("")}` : "";
  $("sReplay").textContent = sess.replays;
  $("sHint").textContent = sess.hints;
  $("sErr").textContent = sess.errSet.size;
  if (status.every(x => x === "ok") && !sess.complete) complete();
}

function complete(){
  sess.complete = true;
  answer.classList.add("done");
  const perfect = !sess.revealed && sess.hints === 0 && sess.errSet.size === 0;
  markDone(lessons()[L].id, S, perfect);
  const label = t(sess.revealed ? "bRevealed" : perfect ? "bPerfect" : "bDone");
  const fb = $("feedback");
  fb.innerHTML = `<span class="badge ${perfect?"":"meh"}">${label}</span>
    <div class="de">${esc(sess.de)}</div>${sess.zh && lang === "zh" ? `<div class="zh">${esc(sess.zh)}</div>` : ""}`;
  fb.classList.add("show");
  $("progBar").style.width = `${(S+1) / lessons()[L].sentences.length * 100}%`;
  renderList();
}

function next(){
  const l = lessons()[L];
  if (S < l.sentences.length - 1){ S++; openSentence(); playCurrent(); }
  else showSummary();
}
function prev(){ if (S > 0){ S--; openSentence(); } }

function hint(){
  if (sess.complete) return;
  const { status } = computeStatus();
  const i = status.findIndex(x => x !== "ok");
  if (i < 0) return;
  sess.hints++; sess.hinted.add(i);
  answer.focus(); render();
}
function reveal(){
  if (sess.complete) return;
  sess.revealed = true;
  sess.words.forEach((_, i) => sess.hinted.add(i));
  render();
}

function showSummary(){
  const l = lessons()[L];
  const n = l.sentences.length, d = lessonDone(l.id).length, p = (progress[l.id+"-perfect"]||[]).length;
  $("practice").style.display = "none";
  const s = $("summary"); s.style.display = "";
  const hasNext = L < lessons().length - 1;
  s.innerHTML = `<h2>🎉 ${esc(t("sumDone", { title: l.title }))}</h2><div class="counter">${esc(l.level)}</div>
    <div class="nums"><div><b>${d}/${n}</b><span>${t("sumSent")}</span></div><div><b>${p}</b><span>${t("sumPerfect")}</span></div></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="redo">${t("redo")}</button>
      ${hasNext ? `<button class="btn primary" id="nextLesson">${t("nextLesson")}</button>` : ""}
    </div>`;
  $("redo").onclick = () => { progress[l.id] = []; progress[l.id+"-perfect"] = []; store.set("gp-progress", progress); syncHook("progress"); openLesson(L, 0); };
  if (hasNext) $("nextLesson").onclick = () => openLesson(L+1);
  $("progBar").style.width = "100%";
}

$("playBtn").onclick = () => { sess.replays++; playCurrent(); render(); answer.focus(); };
$("speeds").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  rate = +b.dataset.rate;
  document.querySelectorAll("#speeds .chip").forEach(c => c.classList.toggle("on", c === b));
  playCurrent(); answer.focus();
};
answer.addEventListener("input", render);
document.addEventListener("keydown", e => {
  if (e.key !== " " || e.target === answer) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (["input","textarea","select","button"].includes(tag) || e.target.isContentEditable) return;
  if (document.querySelector(".modal-bg.show") || $("practice").style.display === "none") return;
  e.preventDefault(); sess.replays++; playCurrent(); render(); answer.focus();
});
answer.addEventListener("keydown", e => {
  if (e.key === " " && !e.ctrlKey && !e.metaKey && !e.altKey){
    const pos = answer.selectionStart ?? answer.value.length;
    const before = answer.value.slice(0, pos);
    if (sess.complete || before === "" || /\s$/.test(before)){ e.preventDefault(); sess.replays++; playCurrent(); render(); }
    return;
  }
  if (e.key === "Enter" && e.shiftKey){ e.preventDefault(); hint(); }
  else if (e.key === "Enter"){ e.preventDefault(); if (sess.complete) next(); else { sess.replays++; playCurrent(); render(); } }
  else if (e.key === "Escape"){ e.preventDefault(); sess.replays++; playCurrent(0.6); render(); }
});
$("umlauts").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const s = answer.selectionStart ?? answer.value.length, en = answer.selectionEnd ?? s;
  answer.value = answer.value.slice(0, s) + b.textContent + answer.value.slice(en);
  answer.focus(); answer.setSelectionRange(s+1, s+1); render();
};

$("revealBtn").onclick = reveal;
$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;

  if ($("vMerge").checked) cues = mergeCues(cues);
  const lesson = { id:"v" + Date.now(), title: $("vTitle").value.trim() || t("ytDefault"), level:"影片", type:"video", videoId:id,
    sentences: cues.map(c => [c.text, "", c.start, c.end]) };
  if (isAdmin && $("vPublic").checked){
    syncHook("public", lesson);
    $("vmodal").classList.remove("show"); $("vPublic").checked = false;
    $("vUrl").value = ""; $("vTitle").value = ""; $("vSubs").value = ""; $("vFile").value = "";
    return;
  }
  lesson.custom = true;
  custom.push(lesson);
  store.set("gp-custom", custom); syncHook("lesson", lesson);
  $("vUrl").value = ""; $("vTitle").value = ""; $("vSubs").value = ""; $("vFile").value = "";
  $("vmodal").classList.remove("show");
  openLesson(lessons().length - 1, 0);
};

// auth modal (open/close only; sign-in logic lives in the Firebase module)
$("authBtn").onclick = () => { $("aErr").textContent = ""; $("amodal").classList.add("show"); };
$("aCancel").onclick = $("aClose").onclick = () => $("amodal").classList.remove("show");
$("uClose").onclick = () => $("umodal").classList.remove("show");
$("uLogin").onclick = () => { $("umodal").classList.remove("show"); $("authBtn").click(); };

// ---------- theme ----------
(function(){
  const btn = document.getElementById("themeBtn");
  let saved = null; try{ saved = localStorage.getItem("gp-theme"); }catch(e){}
  const sysDark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  function apply(theme){
    document.documentElement.setAttribute("data-theme", theme);
    btn.textContent = t(theme === "dark" ? "themeLight" : "themeDark");
  }
  apply(saved || (sysDark ? "dark" : "light"));
  window.addEventListener("gp-lang", () => apply(document.documentElement.getAttribute("data-theme")));
  btn.onclick = () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next); try{ localStorage.setItem("gp-theme", next); }catch(e){}
  };
})();

// language selector
window.t = t;
const langSel = $("langSel");
langSel.innerHTML = Object.entries(window.GP_LANGS || { zh: "繁體中文" }).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
langSel.value = lang;
langSel.onchange = () => {
  lang = langSel.value; store.set("gp-lang", lang);
  applyI18n(); renderList(); loadVoices();
  const l = lessons()[L];
  if (l && $("practice").style.display !== "none"){ setLessonTitle(l); updateSentenceLabels(); render(); }
  else if (l) showSummary();
  window.dispatchEvent(new Event("gp-lang"));
};
applyI18n();
(() => { const last = store.get("gp-last", null); const i = lessons().findIndex(x => x.id === last); openLesson(i >= 0 ? i : 0); })();
</script>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyCgzDgiXQ0zZZh07vQVA8DAqmwIpqBvRpk",
  authDomain: "german-parrot.firebaseapp.com",
  projectId: "german-parrot",
  storageBucket: "german-parrot.firebasestorage.app",
  messagingSenderId: "1077852411685",
  appId: "1:1077852411685:web:8755faed02e3588ace6ccc"
};
const V = "10.12.2", CDN = `https://www.gstatic.com/firebasejs/${V}`;
const el = id => document.getElementById(id);
const authBtn = el("authBtn"), syncState = el("syncState");

let A, F, auth, db;
try {
  const [App, Auth, Fs] = await Promise.all([
    import(`${CDN}/firebase-app.js`), import(`${CDN}/firebase-auth.js`), import(`${CDN}/firebase-firestore.js`)
  ]);
  A = Auth; F = Fs;
  const app = App.initializeApp(firebaseConfig);
  auth = A.getAuth(app); db = F.getFirestore(app);
  A.setPersistence(auth, A.browserLocalPersistence).catch(() => {});
} catch (e) {
  authBtn.disabled = true;
  authBtn.title = t("loginOfflineTip");
  authBtn.textContent = t("loginOffline");
  window.addEventListener("gp-lang", () => { authBtn.title = t("loginOfflineTip"); authBtn.textContent = t("loginOffline"); });
}

const showErr = e => { el("aErr").classList.remove("ok-msg"); el("aErr").textContent = (e.code && window.GP_I18N[e.code]) ? t(e.code) : (t("errGeneric") + (e.code || e.message)); };
const showOk = t => { el("aErr").classList.add("ok-msg"); el("aErr").textContent = t; };

let mode = "login", user = null;
function renderUser(){
  if (!user) return;
  const g = user.providerData[0]?.providerId === "google.com" ? t("googleAcct") : "";
  const plan = t(isAdmin ? "planAdmin" : isPro ? "planPro" : "planFree");
  el("aInfo").textContent = `${user.email || ""}${g}　${t("plan")}：${plan}`;
}
function setMode(m){
  mode = m;
  el("aTitle").textContent = t(m === "login" ? "aLoginTitle" : "aRegTitle");
  el("aSubmit").textContent = t(m === "login" ? "login" : "register");
  el("aSwitch").textContent = t(m === "login" ? "aToReg" : "aToLogin");
  el("aName").style.display = m === "login" ? "none" : "";
  el("aPass").autocomplete = m === "login" ? "current-password" : "new-password";
  el("aErr").textContent = "";
}

// ---------- cloud data ----------
const toCloud = l => ({
  id: l.id, title: l.title, level: l.level, type: l.type || "text", videoId: l.videoId || null, createdAt: Date.now(),
  sentences: l.sentences.map(x => ({ de: x[0], zh: x[1] || "", s: x[2] ?? null, e: x[3] ?? null }))
});
const fromCloud = d => ({
  id: d.id, title: d.title, level: d.level, custom: true,
  ...(d.type === "video" ? { type: "video", videoId: d.videoId } : {}),
  sentences: (d.sentences || []).map(x => x.s == null ? [x.de, x.zh || ""] : [x.de, x.zh || "", x.s, x.e])
});
const userRef = () => F.doc(db, "users", user.uid);
const lessonRef = id => F.doc(db, "users", user.uid, "lessons", id);

let pending = 0;
function busy(delta){
  pending += delta;
  syncState.textContent = t(pending > 0 ? "syncing" : "synced");
}
async function guarded(fn){
  busy(1);
  try { await fn(); } catch (e) { console.error(e); syncState.textContent = t("syncFail"); pending = Math.max(0, pending-1); return; }
  busy(-1);
}
let progTimer = null;
function saveProgressSoon(){
  clearTimeout(progTimer);
  progTimer = setTimeout(() => guarded(() =>
    F.setDoc(userRef(), { progress, email: user.email || null, updatedAt: F.serverTimestamp() }, { merge: true })), 800);
}

async function loadPlan(){
  isPro = false; isAdmin = false;
  try { const e = await F.getDoc(F.doc(db, "entitlements", user.uid)); isPro = e.exists() && e.data().pro === true; } catch (e) {}
  try { const a = await F.getDoc(F.doc(db, "admins", user.uid)); isAdmin = a.exists(); } catch (e) {}
  refreshPlanUI();
}
async function loadPublic(){
  try {
    const ls = await F.getDocs(F.collection(db, "publicLessons"));
    const list = ls.docs.map(d => d.data()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
      .map(d => ({ ...fromCloud(d), custom: false, public: true }));
    setPublicLessons(list);
  } catch (e) { console.error(e); }
}

async function pullAndMerge(){
  await guarded(async () => {
    const snap = await F.getDoc(userRef());
    const cloudProgress = snap.exists() ? (snap.data().progress || {}) : {};
    const ls = await F.getDocs(F.collection(db, "users", user.uid, "lessons"));
    const cloudLessons = ls.docs.map(d => fromCloud(d.data()));
    const localOnly = applyCloud(cloudProgress, cloudLessons);
    if (canPro()) await Promise.all(localOnly.map(l => F.setDoc(lessonRef(l.id), toCloud(l))));
    await F.setDoc(userRef(), { progress, email: user.email || null, updatedAt: F.serverTimestamp() }, { merge: true });
  });
}

function hook(kind, arg){
  if (!user) return;
  if (kind === "progress") saveProgressSoon();
  else if (kind === "lesson") { if (canPro()) guarded(() => F.setDoc(lessonRef(arg.id), toCloud(arg))); }
  else if (kind === "delete") guarded(() => F.deleteDoc(lessonRef(arg)));
  else if (kind === "public") guarded(async () => { await F.setDoc(F.doc(db, "publicLessons", arg.id), toCloud(arg)); await loadPublic(); });
  else if (kind === "deletePublic") guarded(async () => { await F.deleteDoc(F.doc(db, "publicLessons", arg)); await loadPublic(); });
}

// ---------- auth UI ----------
if (auth) {
  loadPublic();
  el("aSwitch").onclick = () => setMode(mode === "login" ? "register" : "login");
  el("aGoogle").onclick = async () => {
    const provider = new A.GoogleAuthProvider();
    try { await A.signInWithPopup(auth, provider); el("amodal").classList.remove("show"); }
    catch (e) {
      if (e.code === "auth/popup-blocked") { try { await A.signInWithRedirect(auth, provider); } catch (e2) { showErr(e2); } }
      else showErr(e);
    }
  };
  el("aSubmit").onclick = async () => {
    const email = el("aEmail").value.trim(), pass = el("aPass").value;
    if (!email || !pass) { el("aErr").textContent = t("errEmailPass"); return; }
    el("aSubmit").disabled = true;
    try {
      if (mode === "login") await A.signInWithEmailAndPassword(auth, email, pass);
      else {
        const cred = await A.createUserWithEmailAndPassword(auth, email, pass);
        const name = el("aName").value.trim();
        if (name) await A.updateProfile(cred.user, { displayName: name });
        A.sendEmailVerification(cred.user).catch(() => {});
      }
      el("aPass").value = "";
      el("amodal").classList.remove("show");
    } catch (e) { showErr(e); }
    el("aSubmit").disabled = false;
  };
  el("aPass").addEventListener("keydown", e => { if (e.key === "Enter") el("aSubmit").click(); });
  el("aForgot").onclick = async () => {
    const email = el("aEmail").value.trim();
    if (!email) { el("aErr").textContent = t("errForgot"); return; }
    try { await A.sendPasswordResetEmail(auth, email); showOk(t("resetSent")); }
    catch (e) { showErr(e); }
  };
  el("aLogout").onclick = async () => { await A.signOut(auth); el("amodal").classList.remove("show"); };

  A.getRedirectResult(auth).catch(() => {});
  window.addEventListener("gp-lang", () => {
    if (user) renderUser(); else { authBtn.textContent = t("login"); setMode(mode); }
    if (syncState.textContent) syncState.textContent = t(pending > 0 ? "syncing" : "synced");
  });
  A.onAuthStateChanged(auth, async u => {
    user = u;
    if (u) {
      const name = u.displayName || (u.email || "").split("@")[0];
      authBtn.textContent = "👤 " + name;
      renderUser();
      el("aGuest").style.display = "none"; el("aUser").style.display = "";
      syncHook = hook;
      await loadPlan();
      renderUser();
      await pullAndMerge();
    } else {
      syncHook = () => {};
      isPro = false; isAdmin = false; refreshPlanUI();
      authBtn.textContent = t("login");
      syncState.textContent = "";
      el("aGuest").style.display = ""; el("aUser").style.display = "none";
      setMode("login");
    }
  });
}
</script>
</body>
</html>
